<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title or 'LoopStream' }}</title>
    <script>
      // Terapkan tema sebelum halaman dirender (hindari kedipan warna)
      (function () {
        try {
          var stored = localStorage.getItem("bsTheme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : prefersDark
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-bs-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-bs-theme", "dark");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='custom.css') }}"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg sticky-top navbar-glass">
      <div class="container app-container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
          <span class="brand-chip"><i class="bi bi-broadcast-pin"></i></span>
          <span class="brand-name">LoopStream</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-label="Buka menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="/">
                <i class="bi bi-house-door me-1"></i>Beranda
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/live_list">
                <i class="bi bi-collection-play me-1"></i>Live List
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/upload_video">
                <i class="bi bi-cloud-arrow-up me-1"></i>Upload Video
              </a>
            </li>
          </ul>
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item">
              <button
                class="btn btn-outline-secondary btn-sm rounded-circle"
                type="button"
                onclick="toggleTheme()"
                title="Ganti mode terang/gelap"
                aria-label="Ganti tema"
              >
                <i id="themeIcon" class="bi bi-moon-stars-fill"></i>
              </button>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle d-flex align-items-center"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <i class="bi bi-person-circle me-1 fs-5"></i
                >{{ session.get('username', 'Guest') }}
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                {% if 'username' in session %}
                <li>
                  <a class="dropdown-item" href="/logout">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                  </a>
                </li>
                {% else %}
                <li>
                  <a class="dropdown-item" href="{{ url_for('login') }}">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login
                  </a>
                </li>
                {% endif %}
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="app-main">
      <div class="container app-container py-4">
        {% block content %}{% endblock %}
      </div>
    </main>

    <footer class="app-footer py-3 mt-auto">
      <div class="container app-container text-center text-body-secondary small">
        LoopStream &middot; Pengelola Siaran YouTube Lokal
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // =====================
      // TEMA (terang / gelap)
      // =====================
      function toggleTheme() {
        var html = document.documentElement;
        var next =
          html.getAttribute("data-bs-theme") === "dark" ? "light" : "dark";
        html.setAttribute("data-bs-theme", next);
        try {
          localStorage.setItem("bsTheme", next);
        } catch (e) {}
        updateThemeIcon(next);
      }

      function updateThemeIcon(theme) {
        var icon = document.getElementById("themeIcon");
        if (icon) {
          icon.className =
            theme === "dark" ? "bi bi-sun-fill" : "bi bi-moon-stars-fill";
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        updateThemeIcon(
          document.documentElement.getAttribute("data-bs-theme")
        );

        // Tandai link navbar yang sedang aktif
        var path = window.location.pathname;
        document.querySelectorAll(".navbar .nav-link").forEach(function (a) {
          var href = a.getAttribute("href");
          if (
            href &&
            (path === href || (href !== "/" && path.indexOf(href) === 0))
          ) {
            a.classList.add("active");
          }
        });
      });
    </script>
  </body>
</html>
